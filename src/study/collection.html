<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习收藏 · Bilingual Reader</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    body { min-height: 100vh; }
    .collection-header { background: var(--hero); color: #fff; }
    .collection-header > div { max-width: 780px; margin: auto; padding: 22px 18px 36px; }
    .brand { display: flex; align-items: center; gap: 8px; color: #eee5ff; font-size: 12px; font-weight: 600; }
    .collection-header h1 { margin: 8px 0 0; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
    main { max-width: 780px; margin: -17px auto 0; padding: 0 18px 30px; position: relative; }
    h2 { margin: 22px 0 8px; font-size: 17px; }
    h3, p { margin: 0; }
    h3 { font-size: 14px; }
    #status, article { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); }
    #status { margin-bottom: 12px; padding: 10px 15px; border-radius: var(--control-radius); }
    #status, .explanation { color: var(--muted); }
    article { margin: 0 0 10px; padding: 14px 17px; border-radius: var(--radius); overflow-wrap: anywhere; }
    article > .source { margin-bottom: 7px; }
    .detail, .phrases { margin-top: 6px; }
    ul { margin: 3px 0; padding-left: 20px; }
  </style>
</head>
<body>
  <header class="collection-header">
    <div>
      <div class="brand"><img class="kai-logo" src="../styles/assets/brand.png" alt=""><span>Bilingual Reader</span></div>
      <h1>学习收藏</h1>
    </div>
  </header>
  <main>
    <p id="status" role="status">正在读取本地收藏…</p>
    <section id="words" aria-labelledby="words-title" hidden>
      <h2 id="words-title">单词</h2>
      <div class="entries"></div>
    </section>
    <section id="sentences" aria-labelledby="sentences-title" hidden>
      <h2 id="sentences-title">句子</h2>
      <div class="entries"></div>
    </section>
  </main>
  <script src="../shared/study-collection.js"></script>
  <script src="../shared/study-view.js"></script>
  <script src="collection.js"></script>
</body>
</html>
