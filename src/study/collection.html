<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习收藏 · Bilingual Reader</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 720px; margin: 40px auto; padding: 0 18px 24px;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    h1 { margin: 0; font-size: 24px; }
    h2 { margin: 20px 0 8px; font-size: 17px; }
    h3, p { margin: 0; }
    h3 { font-size: 14px; }
    #status, .explanation { color: #526179; }
    article { margin: 0 0 10px; padding: 12px 16px; border: 1px solid #d8e0ec;
      border-radius: 10px; overflow-wrap: anywhere; }
    article > .source { margin-bottom: 7px; }
    .detail, .phrases { margin-top: 6px; }
    ul { margin: 3px 0; padding-left: 20px; }
    @media (prefers-color-scheme: dark) {
      #status, .explanation { color: #c4d0e1; }
      article { border-color: #3d4c61; }
    }
  </style>
</head>
<body>
  <main>
    <h1>学习收藏</h1>
    <p id="status" role="status">正在读取本地收藏…</p>
    <section id="words" aria-labelledby="words-title" hidden>
      <h2 id="words-title">单词</h2>
      <div class="entries"></div>
    </section>
    <section id="sentences" aria-labelledby="sentences-title" hidden>
      <h2 id="sentences-title">句子</h2>
      <div class="entries"></div>
    </section>
  </main>
  <script src="../shared/study-collection.js"></script>
  <script src="../shared/study-view.js"></script>
  <script src="collection.js"></script>
</body>
</html>
