<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilingual Reader 双语对照翻译</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <div class="hero-bar">
      <div class="brand">
        <img class="kai-logo" src="../styles/assets/brand.png" alt="">
        <span>Bilingual Reader</span>
      </div>
      <button id="options" class="settings-button" type="button" aria-label="更多设置" title="更多设置">
        <img src="../styles/assets/settings.svg" alt="">
      </button>
    </div>
    <h1>网页翻译</h1>
    <img class="hero-orb" src="../styles/assets/orb.webp" alt="">
  </header>

  <main class="popup-main">
    <div class="notice" id="notice">
      <strong>尚未配置翻译引擎</strong>
      <p>连接模型 API 后即可翻译当前网页。</p>
      <button id="noticeConfig" type="button">去配置翻译引擎 <span aria-hidden="true">↗</span></button>
    </div>

    <div class="notice demo" id="demoNotice">
      <strong>当前为演示模式</strong>
      <p>译文由本机内置词表生成，仅用于体验翻译流程。</p>
    </div>

    <section class="workspace" aria-label="翻译偏好">
      <div class="fields">
        <label class="field" for="lang">目标语言<select id="lang"></select></label>
        <label class="field" for="engine">翻译引擎<select id="engine"></select></label>
      </div>

      <div class="preference-row">
        <span>翻译风格</span>
        <button id="scenarioSettings" class="scenario-tag" type="button" aria-label="设置翻译风格">
          <img src="../styles/assets/stars.svg" alt=""><span id="scenarioName">通用</span><span aria-hidden="true">›</span>
        </button>
      </div>

      <div class="preference-row mode-row">
        <span id="modeLabel">显示模式</span>
        <div class="seg" id="modes" role="group" aria-labelledby="modeLabel">
          <button type="button" data-mode="dual" class="on" aria-pressed="true">双语对照</button>
          <button type="button" data-mode="translation" aria-pressed="false">仅译文</button>
          <button type="button" data-mode="original" aria-pressed="false">仅原文</button>
        </div>
      </div>
    </section>

    <div class="translate-controls">
      <button class="primary" id="toggle" type="button" disabled>翻译此页</button>
      <div class="translation-actions">
        <button id="pause" type="button" disabled title="暂停请求，保留已有译文；继续时从暂停位置的上一段接着翻译">暂停</button>
        <button id="retranslate" type="button" disabled title="清除本页译文，跳过旧缓存，从第一段重新翻译">重新翻译</button>
      </div>
      <div class="status" id="status" role="status">正在读取页面状态…</div>
      <button id="retry" class="retry" type="button" hidden>重试失败段落</button>
    </div>
  </main>

  <footer>
    <div class="utilities">
      <button id="floatingToggle" type="button" title="在普通网页右侧显示或隐藏可上下拖动的翻译浮签">隐藏网页浮签</button>
      <button id="studyCollection" type="button">学习收藏 <span aria-hidden="true">↗</span></button>
    </div>
    <div class="footnote">
      <span><kbd>Alt</kbd> + <kbd>T</kbd> 快速切换</span>
      <span id="ver"></span>
    </div>
  </footer>

  <script src="../shared/defaults.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/prompts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
